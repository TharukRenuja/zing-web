  <script>
    (() => {
      const themeToggle = document.getElementById('theme-toggle');
      if (themeToggle) {
        const sunIcon = themeToggle.querySelector('.sun-icon');
        const moonIcon = themeToggle.querySelector('.moon-icon');
        const mq = window.matchMedia('(prefers-color-scheme: light)');
        function updateIcons(t) {
          if (t === 'light') { sunIcon.style.display = 'none'; moonIcon.style.display = 'block'; }
          else { sunIcon.style.display = 'block'; moonIcon.style.display = 'none'; }
        }
        function getTheme() { return localStorage.getItem('theme') || (mq.matches ? 'light' : 'dark'); }
        function applyTheme(t) { document.documentElement.setAttribute('data-theme', t); updateIcons(t); }
        applyTheme(getTheme());
        mq.addEventListener('change', e => { if (!localStorage.getItem('theme')) applyTheme(e.matches ? 'light' : 'dark'); });
        themeToggle.addEventListener('click', () => {
          const next = getTheme() === 'dark' ? 'light' : 'dark';
          localStorage.setItem('theme', next); applyTheme(next);
        });
      }
    })();
  </script>
