name: Update Docs

on:
  repository_dispatch:
    types: [docs-updated]

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout zing-web
        uses: actions/checkout@v4

      - name: Clone docs from zing v0.3.0
        run: |
          git clone --depth 1 --branch v0.3.0 \
            https://github.com/TharukRenuja/zing.git /tmp/source

      - name: Copy docs
        run: |
          rm -rf docs/content
          mkdir -p docs/content
          cp -r /tmp/source/docs/. docs/content/

      - name: Commit and push changes
        run: |
          git config user.name "zing-docs[bot]"
          git config user.email "docs@zing.tharuk.pro"

          git add docs/content

          if git diff --cached --quiet; then
            echo "No documentation changes."
            exit 0
          fi

          git commit -m "docs: update from zing"
          git push